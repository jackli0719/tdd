version: '3.8'

services:
  # OMS Backend (Go)
  oms:
    build:
      context: ./oms
      dockerfile: Dockerfile
    container_name: oms-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DSN=${OMS_DSN:-sqlite://oms.db}
    volumes:
      - oms-data:/app/data
    restart: unless-stopped
    networks:
      - oms-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Vue/Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oms-frontend
    ports:
      - "80:80"
    depends_on:
      - oms
    restart: unless-stopped
    networks:
      - oms-network

networks:
  oms-network:
    driver: bridge

volumes:
  oms-data: